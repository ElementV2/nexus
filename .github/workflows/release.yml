name: Release

# Auto-builds the Windows installer and publishes a GitHub release
# whenever the version in launcher/package.json is bumped past the
# latest existing tag. Every push to master runs the workflow; if the
# tag for the current version already exists, the build is skipped.
#
# To cut a release: bump `version` in launcher/package.json, commit,
# push. The workflow does the rest.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Gate the release on the same quality checks as every PR. If versions
  # drift, lint/types break, or a test fails, no installer is built.
  checks:
    uses: ./.github/workflows/checks.yml

  release:
    needs: checks
    # Pinned to windows-2022 (NOT windows-latest): GitHub moved `windows-latest`
    # to the Server 2025 image (10.0.26100), where node-gyp's Visual Studio
    # finder fails to locate the C++ toolchain and the native `node-hid` rebuild
    # for nexus-cross dies with "Could not find any Visual Studio installation".
    # windows-2022 ships VS 2022 Build Tools that @electron/rebuild detects.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          # Need full tag history so the existence check below is accurate.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            launcher/package-lock.json
            nexus-cross/package-lock.json

      # electron-builder's @electron/rebuild compiles the native HID/usb/
      # canvas deps with node-gyp, which still imports `distutils` — removed
      # from Python 3.12. The runner defaults to 3.12, so pin 3.11 (ships
      # distutils) or the nexus-cross build fails on `node-hid`.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Read launcher version
        id: version
        shell: bash
        run: |
          v=$(node -p "require('./launcher/package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          echo "Launcher version: $v"

      - name: Check if tag already exists
        id: tag-check
        shell: bash
        run: |
          if git rev-parse "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${{ steps.version.outputs.tag }} already exists — skipping build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${{ steps.version.outputs.tag }} is new — building."
          fi

      - name: Install root deps
        if: steps.tag-check.outputs.exists == 'false'
        run: npm ci

      - name: Install launcher deps
        if: steps.tag-check.outputs.exists == 'false'
        working-directory: launcher
        run: npm ci

      - name: Build installer
        if: steps.tag-check.outputs.exists == 'false'
        working-directory: launcher
        # `package:win` runs `next build` (standalone) → compiles the
        # launcher TS → invokes electron-builder. Output ends up in
        # `launcher/dist/Nexus-Setup-<version>.exe`.
        run: npm run package:win
        env:
          # Avoid electron-builder trying to publish itself; the release
          # step below handles that explicitly.
          GH_TOKEN: ''

      - name: Install nexus-cross deps
        if: steps.tag-check.outputs.exists == 'false'
        working-directory: nexus-cross
        run: npm ci

      - name: Build nexus-cross installer
        if: steps.tag-check.outputs.exists == 'false'
        working-directory: nexus-cross
        # Compiles the satellite TS + copies its renderer, then runs
        # electron-builder (which rebuilds the native HID/canvas deps for
        # the Electron runtime). Output: nexus-cross/dist/
        # Nexus-Cross-Setup-<version>.exe
        run: npm run package:win
        env:
          GH_TOKEN: ''

      # Keep the built installers even if the release step below fails
      # (e.g. a transient GitHub API error) — both builds are long, so
      # they should be recoverable without a full rerun.
      - name: Upload installers as workflow artifacts
        if: steps.tag-check.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ steps.version.outputs.version }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            launcher/dist/Nexus-Setup-*.exe
            nexus-cross/dist/Nexus-Cross-Setup-*.exe

      - name: Create release
        if: steps.tag-check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          # Both installers ride the same release: the main app and the
          # Stream Deck satellite. The in-app updaters each match their
          # own asset name (Nexus-Setup-* vs Nexus-Cross-Setup-*).
          files: |
            launcher/dist/Nexus-Setup-*.exe
            nexus-cross/dist/Nexus-Cross-Setup-*.exe
